*{margin:0;padding:0;box-sizing:border-box}
body {font-family:'Inter',sans-serif;background:#fff;color:#1e293b;padding-bottom:64px; overflow-x:hidden; }
.wrap{max-width:1150px;margin:0 auto;padding:0 16px}

.pd{display:grid;grid-template-columns:1fr 1.05fr;gap:34px;align-items:start}
/* Gallery */
.gal{position:relative}
.gmain{position:relative;background:#f6f6f6;border-radius:6px;display:flex;align-items:center;justify-content:center;height:440px;overflow:hidden}
.gmain img{max-width:100%;max-height:100%;object-fit:contain}

.gth{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.dl{margin:14px auto 0;display:flex;align-items:center;gap:7px;background:#a3e635;color:#14532d;border:none;padding:8px 20px;border-radius:20px;font-weight:700;font-size:.78rem;cursor:pointer}

.meta{font-size:.86rem;color:#475569;line-height:2}
.meta b{color:#1e293b}
.pr-row{margin:12px 0 4px;font-size:.95rem}
.pr-row .big{color:#ec4899;font-size:1.3rem;font-weight:800}
.price-hint{display:inline-flex;align-items:center;gap:5px;background:#fdf2f8;color:#db2777;font-size:.7rem;font-weight:700;padding:5px 13px;border-radius:14px;margin:6px 0 14px}
.slab{font-size:.85rem;font-weight:700;margin:16px 0 8px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid #eee;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;overflow:hidden}

.trow td{background:#fdf2f8;font-weight:800;color:#db2777}
.tot-price{font-size:1.25rem;font-weight:800;margin:14px 0 2px}
.resale-lab{font-size:.8rem;font-weight:700;margin:14px 0 6px}

.profit-line{font-size:.85rem;color:#047857;font-weight:700;margin-top:8px}
.btnrow{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.breadcrumb a.back-link{display:inline-flex;align-items:center;gap:8px;color:#334155;font-weight:700;font-size:.88rem;text-decoration:none}
.breadcrumb a.back-link:hover{color:#0f172a}
.pd-r h1{font-size:1.3rem;font-weight:800;line-height:1.35;margin-bottom:4px}
.sku-l{font-size:.8rem;color:#64748b;margin-bottom:14px}
.var-box{border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;background:#fff}
.vb-lab{font-size:.85rem;font-weight:600;color:#334155;margin-bottom:10px}
.varsel{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:.9rem;color:#1e293b;background:#fff;cursor:pointer}
.vb-row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:#334155;margin-top:12px}
.vb-p{font-weight:700;color:#0f172a}
.vb-c{color:#10b981;font-weight:800}
.act-row{display:flex;gap:14px;margin:16px 0 14px;align-items:stretch}
.act-row2{display:flex;gap:14px}
.qbar{flex:1;display:flex;align-items:stretch;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;background:#fff}
.qbar button{width:48px;border:none;background:#fff;font-size:1.1rem;cursor:pointer;color:#334155}

.rel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}

.rb{width:36px;height:30px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.75rem}

.tabs{border-top:1px solid #eee;margin-top:26px;display:flex;gap:26px;padding:14px 4px 0}
.tabs span{font-size:.92rem;font-weight:700;color:#94a3b8;padding-bottom:10px;cursor:pointer;border-bottom:3px solid transparent}
.tabs span.on{color:#ec4899;border-bottom-color:#ec4899}
.tbody-p{padding:16px 4px;font-size:.9rem;color:#475569;line-height:1.75;white-space:pre-line}
.tbody-p ul{margin:10px 0 0 18px}
.schart{width:100%;border-collapse:collapse;font-size:.83rem;margin-top:10px}
.schart th{background:#f8f8f8;padding:8px 10px;text-align:left;font-size:.72rem;color:#64748b;text-transform:uppercase}
.schart td{padding:8px 10px;border-bottom:1px solid #f4f4f6}
.disc{font-size:.78rem;color:#94a3b8;margin-top:12px;line-height:1.6}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,.08);z-index:300;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.mob-nav a{color:#94a3b8;text-decoration:none;font-size:.6rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;flex:1}
.mob-nav a i{font-size:1.05rem}.mob-nav a.on{color:#ec4899}
.toast{position:fixed;top:20px;right:20px;background:#10b981;color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:.85rem;z-index:9999;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media(max-width:900px){.pd{grid-template-columns:1fr}.gmain{height:320px}}
@media(max-width:768px){body{padding-bottom:64px}.mob-nav{display:flex}}
</style>
<link rel="stylesheet" href="rstyle.css"><style id="reseller-fullwidth-fix">
/* 2026-09-16 — ANDROID FULL-WIDTH FIX (this request).
   On Android the whole page rendered as a ~60%-wide column with a large empty gap on
   the right. Cause: the base rule reserves the sidebar with
   `.main{margin-left:248px}`, and a block element with margin-left and width:auto is
   only (100% - 248px) wide. The page DID have a mobile override
   `.main{margin-left:0 !important}` — but a LATER rule in the same file re-asserted
   `.main{margin-left:248px !important}`, and with equal specificity the later one wins.
   This block sits at the very END of the document, so it beats both, and it resets
   width as well as margin. Desktop is untouched: everything is inside a max-width query. */
@media (max-width:1024px){
  html, body { overflow-x:hidden !important; max-width:100% !important; }
  .main { margin-left:0 !important; width:100% !important; max-width:100% !important; box-sizing:border-box; }
  .content { width:100% !important; max-width:100% !important; box-sizing:border-box; }
}

<script>
(function(){

if(!p){document.getElementById('pdWrap').innerHTML='<div style="text-align:center;padding:80px"><h2>Product not found</h2><a href="products.html" style="color:#ec4899;font-weight:700">Back to products</a></div>';return}
var sups=getData(DB_KEYS.SUPPLIERS),sup=null;
if(p.supplierId){for(var s=0;s<sups.length;s++){if(sups[s].id===p.supplierId){sup=sups[s];break}}}
var soldBy=sup?sup.shopName:(p.supplierName||'ResellerHub BD');
var imgs=p.images&&p.images.length?p.images.slice():(p.image?[p.image]:[]);
var gi=0;

var hexmap={'Red':'#ef4444','Blue':'#3b82f6','Green':'#22c55e','Black':'#111827','White':'#f8fafc','Yellow':'#eab308','Pink':'#ec4899','Gray':'#9ca3af','Multi Color':'linear-gradient(135deg,#ef4444,#3b82f6,#22c55e)'};
var bg=hexmap[cc]||'#cbd5e1';
var st=cc==='White'?'color:#64748b;':'';
swatches+='<div class="sw'+(c===0?' on':'')+'" style="background:'+bg+';'+st+'" onclick="pickCol(\''+cc.replace(/'/g,"\\'")+'\')">'+(imgs.length>1&&c<imgs.length?'<img src="'+imgs[c]+'">':cc.charAt(0))+'</div>';
}
swatches+='</div>';
}

for(var r=0;r<sizes.length;r++){
var sz=sizes[r];
rows+='<tr><td><b>'+sz+'</b></td><td><span class="lk"><i class="fas fa-lock"></i> Locked</span></td><td>'+(p.stock||0)+'</td><td><div class="qc"><button onclick="chg(\''+sz.replace(/'/g,"\\'")+'\',-1)">&minus;</button><input id="q_'+sz.replace(/\s/g,'_')+'" value="0" readonly><button onclick="chg(\''+sz.replace(/'/g,"\\'")+'\',1)">+</button></div></td></tr>';
}
rows+='<tr class="trow"><td>Total</td><td></td><td></td><td style="text-align:right"><span id="totP">0</span> pcs</td></tr>';

else{vopts='<option value="Standard">Standard — '+formatCurrency(p.price)+' TK</option>'}

var cret=p.customer_price?p.customer_price:defResale;

function pickCol(c){window.selColor=c;document.getElementById('cLbl').textContent=c;var sw=document.querySelectorAll('.sw');for(var i=0;i<sw.length;i++){if(sw[i].textContent.charAt(0)===c.charAt(0)||sw[i].getAttribute('onclick').indexOf("'"+c+"'")!==-1)sw[i].classList.add('on');else sw[i].classList.remove('on')}}
window.pickCol=pickCol;
function chg(sz,d){var k=sz.replace(/\s/g,'_');var inp=document.getElementById('q_'+k);var v=(parseInt(inp.value)||0)+d;if(v<0)v=0;inp.value=v;window._qty[sz]=v;var tot=0;for(var key in window._qty)tot+=window._qty[key];document.getElementById('totP').textContent=tot;calcProfit()}
function calcProfit(){}
function selVar(){window.selSize=document.getElementById('varSel').value;document.getElementById('vSize').textContent=window.selSize}
function qch(d){var inp=document.getElementById('qMain');var v=(parseInt(inp.value)||0)+d;if(v<1)v=1;inp.value=v}
function rdl(i){var q=window._rel[i];if(!q||!q.image){showToast('No image to download','error');return}var a=document.createElement('a');a.href=q.image;a.download='product-'+(i+1)+'.png';document.body.appendChild(a);a.click();a.remove();showToast('Image downloaded!','success')}
function rcp(i){var q=window._rel[i];if(!q)return;var rc=q.customer_price||Math.round(q.price*1.8);var t='Product: '+q.name+'\nPrice: '+formatCurrency(q.price)+' TK\nCustomer / Retail Price: '+formatCurrency(rc)+' TK\nSold by: '+(q.supplierName||'ResellerHub')+'\nOrder: resellerhubbd.com | 01997904792';if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){showToast('Details copied!','success')})}else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Details copied!','success')}}
function copyDetails(){var p=window._p;var sz=window.selSize||(window._sizes[0]||'Standard');var t='Product: '+p.name+'\nSKU: '+(p.sku||'N/A')+'\nCategory: '+p.category+'\nWholesale Price: '+formatCurrency(p.price)+'\nCustomer / Retail Price: '+formatCurrency(window._cret)+'\nSize: '+sz+'\nQuantity: '+document.getElementById('qMain').value+'\nSold by: '+(p.supplierName||'ResellerHub')+'\nOrder: resellerhubbd.com | 01997904792';if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){showToast('Details copied!','success')},function(){showToast('Copied!','success')})}else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Details copied!','success')}}
function dlAll(){if(!window._imgs.length){showToast('No images to download','error');return}var n=window._imgs.length;for(var i=0;i<n;i++)(function(i){setTimeout(function(){var a=document.createElement('a');a.href=window._imgs[i];a.download='product-image-'+(i+1)+'.png';document.body.appendChild(a);a.click();a.remove()},i*300)})(i);showToast('Downloading '+n+' images...','success')}
function collect(){var q=parseInt(document.getElementById('qMain').value)||0;if(q<1){showToast('Select quantity first!','error');return null}
var sel=[{size:window.selSize||(window._sizes[0]||'Standard'),qty:q}];
var rp=window._cret||window._defResale;
return{productId:window._p.id,name:window._p.name,image:window._p.image||'',icon:window._p.icon||'fa-box',sku:window._p.sku||'',category:window._p.category,color:window.selColor||'',sizeQty:sel,qty:q,price:window._p.price,cost:window._p.cost||0,resale:rp,supplierId:window._p.supplierId||null,supplierName:window._p.supplierName||''}}
window.toList=function(){var it=collect();if(!it)return;var key='rh_list_'+uid;var l=[];try{l=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}l.push(it);localStorage.setItem(key,JSON.stringify(l));showToast('Added to your list!','success')};
window.toCart=function(){var it=collect();if(!it)return;var key='rh_cart_'+uid;var c=[];try{c=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}c.push(it);localStorage.setItem(key,JSON.stringify(c));showToast('Added to cart! ('+c.length+' items)','success')};
window.buyNow=function(){var it=collect();if(!it)return;sessionStorage.setItem('rh_buynow',JSON.stringify(it));window.location.href='order.html?buynow=1'};
function tshow(n){var s=document.querySelectorAll('.tabs span');for(var i=0;i<s.length;i++)s[i].classList.remove('on');s[n].classList.add('on');document.getElementById('tab0').style.display=n===0?'block':'none';document.getElementById('tab1').style.display=n===1?'block':'none'}
</script>
</body>
</html>
